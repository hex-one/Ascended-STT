<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup Guide</title>
<link rel="stylesheet" href="config.css">
<style>
  body { padding: 16px 20px; }
  #guideTitle { margin: 0 0 10px; font-size: 16px; }
  #guideContent h1 { font-size: 17px; margin: 18px 0 8px; }
  #guideContent h2 { font-size: 14px; margin: 16px 0 6px; }
  #guideContent h3, #guideContent h4 { font-size: 12px; margin: 12px 0 4px; }
  #guideContent p { font-size: 12px; line-height: 1.55; margin: 0 0 10px; }
  #guideContent ul, #guideContent ol { font-size: 12px; line-height: 1.55; margin: 0 0 10px; padding-left: 20px; }
  #guideContent li { margin-bottom: 4px; }
  #guideContent code { background: #e9e4fa; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
  #guideContent pre { background: #e9e4fa; padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 0 0 10px; }
  #guideContent pre code { background: none; padding: 0; }
  #guideContent a { color: #6b3fa0; cursor: pointer; text-decoration: underline; }
  #guideContent hr { border: none; border-top: 1px solid #ccc; margin: 14px 0; }
</style>
</head>
<body>
  <h2 id="guideTitle">Setup Guide</h2>
  <div class="error" id="guideError"></div>
  <div id="guideContent"></div>
  <br>
  <button id="closeBtn" title="Close">Close</button>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="guide.js"></script>
</body>
</html>
